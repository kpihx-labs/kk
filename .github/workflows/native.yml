name: Native Foundation and macOS Storage (Not Product Qualification)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  foundation:
    name: Foundation / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; same pin as check.yml
        with:
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: |
          $pin = Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"$'
          if ($null -eq $pin) { throw 'Missing repository Rust channel' }
          $channel = $pin.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
      - name: Fetch locked dependencies for the native target
        run: cargo fetch --locked --target $env:TARGET
      - name: Provision the owned-PTY test interpreter
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2; same pin as check.yml
        with:
          python-version: '3.13'
          enable-cache: false # These stdlib-only fixtures have no Python dependency lock.
      - name: Use a physical macOS temporary root for protected-storage fixtures
        if: runner.os == 'macOS'
        run: |
          $physicalTmp = uv run --no-project python -c "import pathlib, tempfile; print(pathlib.Path(tempfile.gettempdir()).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([string]::IsNullOrWhiteSpace($physicalTmp)) { throw 'Missing physical temporary root' }
          # Fixture paths must satisfy NOFOLLOW; production path checks remain unchanged.
          "TMPDIR=$physicalTmp" | Add-Content -Path $env:GITHUB_ENV
      - name: Build native binary and compile all test/example targets (not execution)
        run: cargo build --locked --offline --target $env:TARGET --all-targets
      - name: Lint native targets without warning suppression
        run: cargo clippy --locked --offline --target $env:TARGET --all-targets -- -D warnings
      - name: Minimum binary smoke (version, help, invalid argument)
        run: cargo test --locked --offline --target $env:TARGET --test platform_foundation binary_smoke -- --nocapture
      - name: Assert the native platform contract, including intentional refusals
        run: cargo test --locked --offline --target $env:TARGET --test platform_foundation -- --nocapture
      - name: Execute macOS file transfer and envelope storage regressions
        if: runner.os == 'macOS'
        run: cargo test --locked --offline --target $env:TARGET --test files --test envelope -- --nocapture
      - name: Execute macOS private shared IPC ownership and recovery regressions
        if: runner.os == 'macOS'
        run: cargo test --locked --offline --target $env:TARGET --lib node::ipc::path_tests -- --nocapture
      - name: Execute macOS SQLite ancestor refusal, committed-state preservation and actor ownership
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --offline --target $env:TARGET --lib rooms::store::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --target $env:TARGET --lib rooms::lease::tests -- --nocapture
      - name: Execute macOS actual long-path contact, room and HTTP workflows
        if: runner.os == 'macOS'
        run: cargo test --locked --offline --target $env:TARGET --test ipc_long_paths -- --nocapture
      - name: Execute macOS room reservation ownership and startup readiness regressions
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --offline --target $env:TARGET --lib rooms::local::reservation_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --target $env:TARGET --lib rooms::local::session::lane_tests -- --nocapture
      - name: Execute macOS protected history-key regressions
        if: runner.os == 'macOS'
        run: cargo test --locked --offline --target $env:TARGET --test history_keys -- --nocapture
      - name: Execute macOS pipe/socket stdio and supervised worker regressions
        if: runner.os == 'macOS'
        run: cargo test --locked --offline --target $env:TARGET --test stdio_pipe --test stdio_socket --test stdio_worker --test stdio_terminal -- --nocapture
      - name: Execute macOS private staging and atomic publication unit regressions
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --offline --target $env:TARGET --lib files:: -- --nocapture
      - name: Execute macOS publication consent, owner revocation and cancellation regressions
        if: runner.os == 'macOS'
        run: cargo test --locked --offline --target $env:TARGET --lib rooms::control::raft::service::tests::consent -- --nocapture
      - name: Execute macOS publication grant lock regressions
        if: runner.os == 'macOS'
        run: cargo test --locked --offline --target $env:TARGET --lib rooms::control::raft::network::file::tests -- --nocapture
      - name: Report scope even when a foundation gate fails
        if: always()
        run: |
          @'
          ## Native foundation and bounded macOS storage
          Compilation/lint, minimum binary smoke and explicit platform-contract tests run on all hosts. macOS additionally executes selected storage, transfer, envelope, shared IPC, actual long-path workflows, protected history-key and publication/consent regressions. Read each step result; this summary is not a passing result.
          Other product integration and library unit suites are NOT executed here. See docs/platforms.md for the exact gating inventory and filesystem/durability scope.
          Windows protected storage/IPC remains refused. Selected macOS IPC/history-key tests do not qualify the complete room lifecycle, capture, UI, installers or the whole product. Expected refusals are tested, not presented as working product features.
          No release, installer, artifact upload, signing, physical capture or native product-support claim is made. This workflow is not a dependency of the existing release job.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
