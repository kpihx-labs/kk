stages:
  - check

rust-foundation:
  stage: check
  image: rust:1.99.1
  timeout: 15m
  script:
    - rustup component add rustfmt clippy
    - cargo fetch --locked
    - cargo fmt --package kk -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked --all-targets
    - cargo doc --locked --no-deps
  variables:
    RUSTDOCFLAGS: -D warnings

browser-adapter:
  stage: check
  image: node:24-bookworm
  timeout: 5m
  script:
    - node --check src/ui/assets/app.js
    - node --check src/ui/assets/media.js
    - node --check src/ui/assets/rtp.js
    - node --check src/ui/assets/audio-worklet.js
    - node --test tests/ui_rtp.mjs tests/ui_client.mjs

release-integrity:
  stage: check
  image: ghcr.io/astral-sh/uv:0.10.3-python3.12-trixie-slim
  timeout: 5m
  script:
    - uvx --from ruff==0.16.9 ruff check --target-version py311 scripts tests/test_release.py tests/test_docs.py
    - uv run --no-project python -m unittest discover -s tests -p 'test_release.py'
    - uv run --no-project python -m unittest discover -s tests -p 'test_docs.py'
